<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>하스스톤 카드 평가표</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#C47B2A;--gold-l:#E8A84A;
  --bg:#1A1208;--bg2:#221A0D;--bg3:#2C2010;
  --sf:#2E2213;--sf2:#3A2C18;
  --bd:rgba(196,123,42,0.22);--bd2:rgba(196,123,42,0.48);
  --tx:#F0E6D0;--tx2:#A89070;--tx3:#6E5A40;
  --r:8px;--rl:12px;
}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}

/* ── HEADER ── */
.hdr{background:var(--bg2);border-bottom:1px solid var(--bd2);padding:0 20px;display:flex;align-items:center;gap:12px;height:50px;position:sticky;top:0;z-index:300;}
.logo-ic{width:28px;height:28px;background:linear-gradient(135deg,var(--gold),#8B5A1A);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.logo-tx{font-size:15px;font-weight:700;}
.hd-sp{flex:1;}
.hd-btn{display:flex;align-items:center;gap:5px;height:29px;padding:0 11px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid;font-family:'Noto Sans KR',sans-serif;}
.hd-btn:hover{opacity:.75;}
.b-xl{background:#182F18;color:#7DC87D;border-color:#265226;}
.b-pdf{background:#311111;color:#E87A7A;border-color:#4A1A1A;}

/* ── LAYOUT ── */
.layout{display:flex;min-height:calc(100vh - 50px);}

/* ── SIDEBAR ── */
.sidebar{width:178px;min-width:178px;background:var(--bg2);border-right:1px solid var(--bd);padding:10px 0;position:sticky;top:50px;height:calc(100vh - 50px);overflow-y:auto;flex-shrink:0;}
.sb-lbl{font-size:9px;font-weight:700;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;padding:0 13px 5px;}
.sb-btn{display:flex;align-items:center;gap:7px;width:100%;padding:7px 13px;background:none;border:none;cursor:pointer;color:var(--tx2);font-size:12px;font-weight:500;text-align:left;font-family:'Noto Sans KR',sans-serif;transition:background .1s,color .1s;}
.sb-btn:hover{background:var(--sf);color:var(--tx);}
.sb-btn.active{background:var(--sf2);color:var(--gold-l);}
.sb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sb-cnt{margin-left:auto;font-size:10px;color:var(--tx3);background:var(--bg3);border-radius:10px;padding:1px 6px;}
.sb-div{height:1px;background:var(--bd);margin:5px 0;}

/* ── MAIN ── */
.main{flex:1;padding:14px 18px;min-width:0;}

/* ── EXPANSION BAR ── */
.exp-bar{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:12px 14px;margin-bottom:12px;}
.exp-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.exp-title{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.8px;text-transform:uppercase;}
.exp-search-inp{height:28px;padding:0 10px;background:var(--bg3);border:1px solid var(--bd);border-radius:20px;color:var(--tx);font-size:12px;font-family:'Noto Sans KR',sans-serif;width:160px;}
.exp-search-inp:focus{outline:none;border-color:var(--gold);}
.exp-search-inp::placeholder{color:var(--tx3);}
.exp-sel-lbl{font-size:12px;color:var(--gold-l);font-weight:500;margin-left:auto;}
.exp-clear-btn{height:24px;padding:0 8px;border:1px solid var(--bd2);border-radius:12px;background:none;color:var(--tx3);font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.exp-clear-btn:hover{color:#E87A7A;}
.exp-grid{display:flex;flex-wrap:wrap;gap:5px;max-height:130px;overflow-y:auto;}
.exp-chip{padding:4px 11px;border-radius:16px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);font-size:11px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap;line-height:1.4;}
.exp-chip:hover{border-color:var(--bd2);color:var(--tx);}
.exp-chip.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.exp-status{font-size:12px;color:var(--tx3);padding:6px 0;}

/* ── EVAL BAR ── */
.eval-bar{display:flex;align-items:center;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
.eval-lbl{font-size:11px;color:var(--tx3);flex-shrink:0;}
.eval-chip{display:inline-flex;align-items:center;gap:0;padding:0;background:var(--sf2);border:1px solid var(--bd);border-radius:16px;font-size:11px;overflow:hidden;}
.eval-chip-name{padding:3px 6px;color:var(--tx);cursor:text;width:52px;outline:none;border:none;background:transparent;font-size:11px;font-family:'Noto Sans KR',sans-serif;font-weight:500;}
.eval-chip-name:focus{background:var(--bg2);color:var(--gold-l);width:80px;}
.eval-chip-rm{background:none;border:none;border-left:1px solid var(--bd);cursor:pointer;color:var(--tx3);font-size:13px;padding:3px 7px;line-height:1;font-family:inherit;transition:color .1s;}
.eval-chip-rm:hover{color:#E87A7A;}
.eval-add{display:flex;align-items:center;gap:3px;height:26px;padding:0 10px;border:1px dashed var(--bd2);border-radius:16px;background:none;color:var(--tx3);font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
.eval-add:hover{border-color:var(--gold);color:var(--gold-l);}

/* ── CLASS SECTION ── */
.cls-sec{margin-bottom:24px;}
.cls-hdr{display:flex;align-items:center;gap:7px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--bd);}
.cls-dot{width:8px;height:8px;border-radius:50%;}
.cls-name{font-size:13px;font-weight:700;}
.cls-cnt{font-size:11px;color:var(--tx3);}

/* ── CARD GRID ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}

/* ── CARD ITEM ── */
.card-item{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:visible;display:flex;flex-direction:column;}
.card-img-wrap{background:var(--bg3);display:flex;align-items:center;justify-content:center;padding:6px 6px 2px;border-radius:var(--rl) var(--rl) 0 0;overflow:hidden;}
.card-img-wrap img{width:100%;max-width:188px;height:auto;display:block;margin:0 auto;}
.card-img-placeholder{width:188px;height:258px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx3);font-size:10px;}
.card-img-placeholder .ph-ic{font-size:26px;}
.card-title-bar{padding:4px 8px 5px;background:var(--bg3);border-top:1px solid var(--bd);display:flex;align-items:center;gap:5px;}
.card-cost{flex-shrink:0;width:18px;height:18px;background:#5070C0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;line-height:1;}
.card-title{font-size:11px;font-weight:500;color:var(--tx2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── EVAL 세로 블록 ── */
.card-evals{border-top:1px solid var(--bd);display:flex;flex-direction:column;}
.ev-block{border-bottom:1px solid rgba(196,123,42,0.12);}
.ev-block:last-child{border-bottom:none;}
.ev-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(196,123,42,0.08);}
.ev-name{padding:5px 7px;font-size:11px;font-weight:600;color:var(--tx);border-right:1px solid rgba(196,123,42,0.1);display:flex;align-items:center;}
/* ── 커스텀 등급 드롭다운 ── */
.ev-grade{padding:4px 6px;display:flex;align-items:center;position:relative;z-index:10;}
.grade-btn{width:100%;height:26px;padding:0 8px 0 6px;border-radius:5px;border:none;cursor:pointer;font-size:11px;font-weight:600;color:#fff;font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;justify-content:space-between;gap:4px;white-space:nowrap;}
.grade-판도  {background:#C47B2A;}
.grade-좋음  {background:#2A7A3A;}
.grade-가능성{background:#2A5AA0;}
.grade-가루  {background:#505050;}
.grade-dropdown{position:fixed;z-index:9999;background:var(--bg2);border:1px solid var(--bd2);border-radius:6px;overflow:hidden;min-width:88px;display:none;box-shadow:0 6px 16px rgba(0,0,0,.7);}
.grade-dropdown.open{display:block;}
.grade-opt{padding:6px 10px;font-size:11px;font-weight:600;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;}
.grade-opt:hover{filter:brightness(1.25);}
.grade-opt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#fff;opacity:.6;}
.ev-comment{padding:4px 7px 6px;}
.cmt-inp{width:100%;padding:5px 7px;background:var(--bg3);border:1px solid var(--bd);border-radius:5px;color:var(--tx);font-size:11px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:52px;line-height:1.5;transition:border-color .15s;}
.cmt-inp:focus{outline:none;border-color:var(--gold);}
.cmt-inp::placeholder{color:var(--tx3);}

/* ── EMPTY ── */
.empty{text-align:center;padding:50px 20px;color:var(--tx3);font-size:13px;}
.empty-ic{font-size:32px;display:block;margin-bottom:8px;}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:999;}
.modal{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--rl);padding:20px;width:280px;}
.modal h2{font-size:13px;font-weight:700;margin-bottom:11px;}
.modal input{width:100%;height:32px;padding:0 10px;background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r);color:var(--tx);font-size:13px;font-family:'Noto Sans KR',sans-serif;margin-bottom:12px;}
.modal input:focus{outline:none;border-color:var(--gold);}
.modal-btns{display:flex;gap:7px;justify-content:flex-end;}
.modal-btns button{height:29px;padding:0 13px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.m-cancel{background:var(--bg3);border:1px solid var(--bd);color:var(--tx2);}
.m-ok{background:var(--gold);border:none;color:#fff;}

/* CLASS COLORS */
.cc-dk{background:#4A8FA8;}.ct-dk{color:#4A8FA8;}
.cc-dh{background:#C86432;}.ct-dh{color:#C86432;}
.cc-druid{background:#A07040;}.ct-druid{color:#A07040;}
.cc-hunter{background:#4A8A2A;}.ct-hunter{color:#5AAA35;}
.cc-mage{background:#5070C0;}.ct-mage{color:#7090E0;}
.cc-paladin{background:#C8A820;}.ct-paladin{color:#D4B830;}
.cc-priest{background:#909090;}.ct-priest{color:#B8B8B8;}
.cc-rogue{background:#505050;}.ct-rogue{color:#909090;}
.cc-shaman{background:#4060B0;}.ct-shaman{color:#6080CC;}
.cc-warlock{background:#7040A0;}.ct-warlock{color:#A060CC;}
.cc-warrior{background:#A03020;}.ct-warrior{color:#CC5040;}
.cc-neutral{background:#606060;}.ct-neutral{color:#909090;}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px;}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo-ic">HS</div>
  <span class="logo-tx">카드 평가표</span>
  <div class="hd-sp"></div>
  <button class="hd-btn b-xl" onclick="exportExcel()">📊 엑셀 저장</button>
  <button class="hd-btn b-pdf" onclick="exportPDF()">📄 PDF 저장</button>
</header>

<div class="layout">
  <nav class="sidebar">
    <div class="sb-lbl">보기</div>
    <button class="sb-btn active" onclick="setFilter('all',this)">
      <span class="sb-dot" style="background:#888"></span>전체 보기
      <span class="sb-cnt" id="cnt-all">0</span>
    </button>
    <div class="sb-div"></div>
    <div class="sb-lbl">직업별 보기</div>
    <div id="classBtns"></div>
  </nav>

  <main class="main">
    <div class="exp-bar">
      <div class="exp-top">
        <span class="exp-title">확장팩 선택</span>
        <span class="exp-sel-lbl" id="expSelLbl"></span>
        <button class="exp-clear-btn" id="expClearBtn" style="display:none" onclick="clearSet()">✕ 초기화</button>
      </div>
      <div class="exp-grid" id="expGrid">
        <span class="exp-status" id="expStatus">카드 데이터 불러오는 중…</span>
      </div>
    </div>

    <div class="eval-bar">
      <span class="eval-lbl">평가자:</span>
      <div id="evalChips"></div>
      <button class="eval-add" onclick="openModal()">+ 추가</button>
    </div>

    <div id="cardsArea"></div>
  </main>
</div>

<div class="modal-ov" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2>평가자 추가</h2>
    <input type="text" id="evalInput" placeholder="이름 입력"/>
    <div class="modal-btns">
      <button class="m-cancel" onclick="closeModal()">취소</button>
      <button class="m-ok" onclick="confirmEval()">추가</button>
    </div>
  </div>
</div>

<script>
// ── 상수 ──────────────────────────────────────────────────────
const CLASS_ORDER = [
  {key:'DEATHKNIGHT', label:'죽음의 기사', cc:'cc-dk',      ct:'ct-dk'},
  {key:'DEMONHUNTER', label:'악마사냥꾼',  cc:'cc-dh',      ct:'ct-dh'},
  {key:'DRUID',       label:'드루이드',    cc:'cc-druid',   ct:'ct-druid'},
  {key:'HUNTER',      label:'사냥꾼',      cc:'cc-hunter',  ct:'ct-hunter'},
  {key:'MAGE',        label:'마법사',      cc:'cc-mage',    ct:'ct-mage'},
  {key:'PALADIN',     label:'성기사',      cc:'cc-paladin', ct:'ct-paladin'},
  {key:'PRIEST',      label:'사제',        cc:'cc-priest',  ct:'ct-priest'},
  {key:'ROGUE',       label:'도적',        cc:'cc-rogue',   ct:'ct-rogue'},
  {key:'SHAMAN',      label:'주술사',      cc:'cc-shaman',  ct:'ct-shaman'},
  {key:'WARLOCK',     label:'흑마법사',    cc:'cc-warlock', ct:'ct-warlock'},
  {key:'WARRIOR',     label:'전사',        cc:'cc-warrior', ct:'ct-warrior'},
  {key:'NEUTRAL',     label:'중립',        cc:'cc-neutral', ct:'ct-neutral'},
];
const GRADES = ['판도','좋음','가능성','가루'];

// ── 확장팩 목록 (블리자드 공식 API slug 기준, 확인 완료) ──────
const TARGET_EXPANSIONS = [
  { id: 'VIOLET_HOLD',  ko: '보라빛 요새 탈출',       slug: 'escape-from-violet-hold'     },
  { id: 'CATACLYSM',    ko: '대격변',                  slug: 'cataclysm'                   },
  { id: 'TIME_TRAVEL',  ko: '시간의 길 너머로',        slug: 'across-the-timeways'         },
  { id: 'THE_LOST_CITY',ko: '운고로의 잃어버린 도시',  slug: 'the-lost-city-of-ungoro'     },
  { id: 'EMERALD_DREAM',ko: '에메랄드의 꿈',           slug: 'into-the-emerald-dream'      },
  { id: 'BLACK_EMPIRE', ko: '검은 제국의 지배',        slug: 'reign-of-the-black-empire'   },
];

// 보라빛 요새 카드 ID → classId 직접 매핑 (API 실측값)
const VH_CLASS_MAP = {"123995":12,"124003":12,"124073":9,"124075":7,"124079":6,"124080":6,"124150":12,"125462":5,"125571":7,"125643":12,"125660":5,"125803":10,"125878":9,"125893":10,"125914":12,"125915":9,"125917":9,"125918":12,"125934":3,"125983":7,"125985":7,"125986":12,"125988":7,"125989":7,"125993":2,"125996":3,"125998":3,"126002":10,"126045":2,"126054":2,"126055":6,"126092":12,"126094":10,"126098":7,"126100":10,"126104":10,"126109":4,"126111":4,"126113":4,"126116":4,"126122":6,"126124":6,"126125":9,"126127":6,"126128":9,"126129":9,"126135":9,"126136":10,"126180":2,"126205":2,"126210":12,"126211":14,"126221":7,"126222":14,"126225":2,"126243":2,"126252":1,"126253":4,"126254":1,"126255":1,"126259":1,"126260":1,"126261":1,"126294":3,"126295":3,"126299":3,"126353":4,"126354":4,"126355":4,"126356":4,"126365":1,"126407":8,"126409":8,"126410":8,"126413":8,"126415":8,"126416":8,"126419":3,"126422":3,"126423":3,"126425":3,"126472":12,"126477":9,"126478":9,"126479":12,"126482":6,"126497":12,"126502":1,"126503":1,"126597":10,"126598":10,"126600":12,"126602":12,"126604":12,"126616":5,"126617":5,"126618":5,"126619":5,"126620":5,"126621":5,"126627":8,"126652":5,"126660":14,"126662":14,"126663":14,"126664":14,"126666":12,"126841":4,"126867":6,"126874":12,"126896":6,"126898":6,"126911":1,"126937":12,"126938":8,"127155":14,"127157":14,"127159":14,"127260":10,"127319":5,"127322":12,"127688":8,"127711":8,"127815":2,"127932":2,"127946":2,"127994":12,"127996":12,"128004":12,"128019":14,"128052":12,"128053":12,"129983":7,"130021":7,"131316":12};

// classId → 직업 (API 직접 확인 완료)
// druid=2, hunter=3, mage=4, paladin=5, priest=6, rogue=7, shaman=8, warlock=9, warrior=10
// deathknight=1, demonhunter=14, neutral=12
const VH_CLASSID_TO_CLASS = {
  1:  'DEATHKNIGHT',
  2:  'DRUID',
  3:  'HUNTER',
  4:  'MAGE',
  5:  'PALADIN',
  6:  'PRIEST',
  7:  'ROGUE',
  8:  'SHAMAN',
  9:  'WARLOCK',
  10: 'WARRIOR',
  12: 'NEUTRAL',
  14: 'DEMONHUNTER',
};
function classIdToKey(classId, multiClassIds) {
  const id = (multiClassIds?.length) ? multiClassIds[0] : classId;
  return VH_CLASSID_TO_CLASS[id] || 'NEUTRAL';

// 실패 시 hearthstonejson으로 폴백
const BNET_CLIENT_ID     = '60b3aff34c094097b7b3dd82ae3f7f1c';
const BNET_CLIENT_SECRET = 'jGQBzMMBRUWjJ7lmciT2LpHX9d7UWB18';
const BNET_TOKEN_URL     = 'https://oauth.battle.net/token';
const BNET_REGION        = 'kr';
const BNET_CARDS_API     = `https://${BNET_REGION}.api.blizzard.com/hearthstone/cards`;
const BNET_LOCALE        = 'ko_KR';

let _bnetToken = null;

async function getBnetToken() {
  if (_bnetToken && _bnetToken.expiresAt > Date.now()) return _bnetToken.access_token;
  const cred = btoa(`${BNET_CLIENT_ID}:${BNET_CLIENT_SECRET}`);
  const r = await fetch(BNET_TOKEN_URL, {
    method: 'POST',
    headers: {
      'Authorization': `Basic ${cred}`,
      'Content-Type': 'application/x-www-form-urlencoded',
    },
    body: 'grant_type=client_credentials',
  });
  if (!r.ok) throw new Error(`토큰 발급 실패 HTTP ${r.status}`);
  const data = await r.json();
  _bnetToken = { access_token: data.access_token, expiresAt: Date.now() + (data.expires_in - 60) * 1000 };
  return _bnetToken.access_token;
}

// 블리자드 API slug → hearthstonejson set 코드 매핑
const SLUG_TO_SETCODE = {
  'escape-from-violet-hold':   'ESCAPEFROM_VIOLET_HOLD',
  'cataclysm':                 'CATACLYSM',
  'across-the-timeways':       'TIME_TRAVEL',
  'the-lost-city-of-ungoro':   'THE_LOST_CITY',
  'into-the-emerald-dream':    'EMERALD_DREAM',
  'reign-of-the-black-empire': 'BE',
};

// 블리자드 API로 확장팩 카드 목록 가져오기 (페이징 처리)
async function fetchBnetCards(slug, token) {
  let page = 1, all = [];
  while (true) {
    const url = `${BNET_CARDS_API}?locale=${BNET_LOCALE}&set=${slug}&pageSize=100&page=${page}`;
    const r = await fetch(url, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const cards = data.cards ?? [];
    all = all.concat(cards);
    if (page >= (data.pageCount ?? 1)) break;
    page++;
  }
  return all;
}

async function loadCards(saved = {}) {
  const st = document.getElementById('expStatus');
  try {
    st.textContent = '카드 데이터 불러오는 중…';
    st.style.display = '';
    st.style.color = '';

    cardsByExp = {};

    // ── 1. 블리자드 OAuth 토큰 발급 시도 ────────────────────────
    let token = null;
    try {
      token = await getBnetToken();
      console.log('블리자드 API 토큰 발급 성공');
    } catch(e) {
      console.warn('블리자드 토큰 발급 실패, hearthstonejson 폴백:', e.message);
    }

    // ── 2. hearthstonejson 보조 맵 (한글명 + 직업 보완용) ───────
    let ko = [];
    try {
      const rKo = await fetch('https://api.hearthstonejson.com/v1/latest/koKR/cards.json');
      if (rKo.ok) ko = await rKo.json();
    } catch(e) {
      console.warn('hearthstonejson 로드 실패, 하드코딩 데이터 사용:', e.message);
    }
    const hsMap = {}; // id → {cardClass, name, cost}
    ko.forEach(c => {
      if (c.id) hsMap[String(c.id)] = {
        cardClass: (c.cardClass || 'NEUTRAL').toUpperCase(),
        name: c.name || '',
        cost: c.cost ?? 0,
      };
    });

    if (token) {
      // ── 3A. 블리자드 API 경로 ──────────────────────────────────
      // VIOLET_HOLD는 API에 없으므로 하드코딩, 나머지는 API 호출
      cardsByExp['VIOLET_HOLD'] = getVHCards(hsMap);

      const apiExps = TARGET_EXPANSIONS.filter(e => e.id !== 'VIOLET_HOLD');
      const results = await Promise.allSettled(
        apiExps.map(exp => fetchBnetCards(exp.slug, token))
      );

      results.forEach((result, i) => {
        const exp = apiExps[i];
        const apiCards = result.status === 'fulfilled' ? result.value : [];

        if (exp.id === 'BLACK_EMPIRE' && apiCards.length < 100) {
          // 출시 전이라 API 데이터 없음 → 하드코딩 사용
          cardsByExp[exp.id] = getBECards(hsMap);
        } else if (apiCards.length > 0) {
          cardsByExp[exp.id] = apiCards.map(c => {
            const id = String(c.id);
            const hs = hsMap[id] || {};
            // 블리자드 API 카드 이미지 URL 구성
            const blizzImgBase = `https://art.hearthstonejson.com/v1/render/latest/koKR/256x/${id}.png`;
            return {
              id,
              name:      hs.name || c.name || '',
              cost:      c.manaCost ?? hs.cost ?? 0,
              cardClass: hs.cardClass || (c.multiClassGroup ? 'NEUTRAL' : (c.classId ? classIdToName(c.classId) : 'NEUTRAL')),
              imageUrl:  c.image || blizzImgBase,
              cropImage: c.cropImage || '',
            };
          });
        } else {
          cardsByExp[exp.id] = [];
        }
      });
    } else {
      // ── 3B. 블리자드 API 실패 → hearthstonejson 폴백 ──────────
      const HARDCODED_SLUGS = new Set(['escape-from-violet-hold', 'reign-of-the-black-empire']);
      const allSetCodes = new Set(
        Object.entries(SLUG_TO_SETCODE)
          .filter(([slug]) => !HARDCODED_SLUGS.has(slug))
          .map(([, code]) => code)
      );
      const setCodeToExpId = {};
      TARGET_EXPANSIONS.forEach(exp => {
        setCodeToExpId[SLUG_TO_SETCODE[exp.slug]] = exp.id;
      });
      TARGET_EXPANSIONS.forEach(exp => { cardsByExp[exp.id] = []; });
      cardsByExp['VIOLET_HOLD'] = getVHCards(hsMap);

      // 검은 제국의 지배
      const beFromAPI = ko.filter(c => c.collectible && c.name && c.type && c.set === 'BE');
      if (beFromAPI.length >= 100) {
        cardsByExp['BLACK_EMPIRE'] = beFromAPI.map(c => ({
          id:        String(c.id),
          name:      c.name,
          cost:      c.cost ?? 0,
          cardClass: (c.cardClass || 'NEUTRAL').toUpperCase(),
          imageUrl:  `https://art.hearthstonejson.com/v1/render/latest/koKR/256x/${c.id}.png`,
          cropImage: '',
        }));
      } else {
        cardsByExp['BLACK_EMPIRE'] = getBECards(hsMap);
      }

      ko.filter(c => c.collectible && c.name && c.type && allSetCodes.has(c.set))
        .forEach(c => {
          const expId = setCodeToExpId[c.set];
          if (expId) cardsByExp[expId].push({
            id:        String(c.id),
            name:      c.name,
            cost:      c.cost ?? 0,
            cardClass: (c.cardClass || 'NEUTRAL').toUpperCase(),
            imageUrl:  `https://art.hearthstonejson.com/v1/render/latest/koKR/256x/${c.id}.png`,
            cropImage: '',
          });
        });
    }

    renderExpGrid();
    if (saved.selectedExpId) {
      selectSet(saved.selectedExpId, saved.evalData || {});
    }
  } catch(e) {
    st.textContent = `로딩 실패: ${e.message}`;
    st.style.color = '#E87A7A';
    st.style.display = '';
    console.error('loadCards 에러:', e);
  }
}

function selectSet(expId, savedEvalData = null) {
  selectedExpId = expId;
  const info = TARGET_EXPANSIONS.find(e => e.id === expId);

  // 현재 카드 평가 보존 (확장팩 전환 시) 또는 localStorage에서 복원
  const evalMap = savedEvalData || {};
  if (!savedEvalData) cards.forEach(c => { evalMap[c.id] = c.evals; });

  cards = (cardsByExp[expId] || [])
    .map(c => ({
      id:        c.id,
      name:      c.name,
      cost:      c.cost ?? 0,
      cardClass: c.cardClass || 'NEUTRAL',
      imageUrl:  c.imageUrl,   // 블리자드 cloudfront URL
      cropImage: c.cropImage,
      evals: evalMap[c.id] || evaluators.map(() => ({grade: GRADES[0], comment: ''})),
    }))
    .sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name, 'ko'));

  document.getElementById('expSelLbl').textContent = info ? `✓ ${info.ko}` : '';
  document.getElementById('expClearBtn').style.display = '';

  document.querySelectorAll('.exp-chip').forEach(btn => {
    btn.classList.toggle('active', btn.title === (info?.ko || ''));
  });

  updateCounts();
  renderArea();
  saveState();
}

function clearSet() {
  selectedExpId = null;
  cards = [];
  document.getElementById('expSelLbl').textContent = '';
  document.getElementById('expClearBtn').style.display = 'none';
  document.querySelectorAll('.exp-chip').forEach(b => b.classList.remove('active'));
  updateCounts();
  renderArea();
  saveState();
}

function onImgErr(img, id, cropImage) {

    cropImage, // 카드 아트 (작은 이미지)
    `https://art.hearthstonejson.com/v1/render/latest/koKR/256x/${id}.png`,
    `https://art.hearthstonejson.com/v1/render/latest/enUS/256x/${id}.png`,
    `https://art.hearthstonejson.com/v1/render/latest/koKR/512x/${id}.png`,
    `https://art.hearthstonejson.com/v1/render/latest/enUS/512x/${id}.png`,
  ].filter(Boolean);
  const i = parseInt(img.dataset.fb || '0');
  if (i < chain.length) { img.dataset.fb = i + 1; img.src = chain[i]; }
  else img.outerHTML = `<div class="card-img-placeholder"><span class="ph-ic">🃏</span><small>${id}</small></div>`;

function toggleGrade(btnId, ci, ei) {
  const btn = document.getElementById(btnId);
  const rect = btn.getBoundingClientRect();
  const isOpen = _dd.classList.contains('open') && _ddTarget?.btnId === btnId;

  closeGradeDD();
  if (isOpen) return;

  _ddTarget = {ci, ei, btnId};
  _dd.innerHTML = GRADES.map(g => `
    <div class="grade-opt" style="background:${GRADE_COLORS[g]}"
      onmousedown="pickGrade(event,'${btnId}',${ci},${ei},'${g}')">
      <span class="grade-opt-dot"></span>${g}
    </div>`).join('');

  // 버튼 아래 fixed 위치
  _dd.style.top  = (rect.bottom + 2) + 'px';
  _dd.style.left = rect.left + 'px';
  _dd.classList.add('open');
}

function pickGrade(e, btnId, ci, ei, val) {
  e.preventDefault();
  e.stopPropagation();
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.className = `grade-btn grade-${val}`;
    btn.innerHTML = `${val} <span style="font-size:10px;opacity:.8;">▾</span>`;
  }
  closeGradeDD();
  cards[ci].evals[ei].grade = val;
  saveState();
}

function closeGradeDD() {
  _dd.classList.remove('open');
  _ddTarget = null;
}

  if (!ta) return;
  const ci = parseInt(ta.dataset.ci);
  const ei = parseInt(ta.dataset.ei);
  if (!isNaN(ci) && !isNaN(ei) && cards[ci]) {

    debounceSave();
  }
}

function renderAll() { renderChips(); updateCounts(); renderArea(); }

function renderArea() {
  renderChips();
  const area = document.getElementById('cardsArea');

  if (!selectedExpId) {
    area.innerHTML = `<div class="empty"><span class="empty-ic">🃏</span>위에서 확장팩을 선택하면 카드가 자동으로 불러와집니다</div>`;
    return;
  }

  const filtered = currentFilter === 'all'
    ? cards
    : cards.filter(c => normClass(c.cardClass) === currentFilter);

  if (filtered.length === 0) {
    area.innerHTML = `<div class="empty"><span class="empty-ic">🔍</span>이 직업의 카드가 없습니다</div>`;
    return;
  }

  if (currentFilter === 'all') {
    let html = '';
    CLASS_ORDER.forEach(cl => {
      const clCards = filtered.filter(c => normClass(c.cardClass) === cl.key);
      if (!clCards.length) return;
      html += `<div class="cls-sec">
        <div class="cls-hdr">
          <span class="cls-dot ${cl.cc}"></span>
          <span class="cls-name">${cl.label}</span>
          <span class="cls-cnt">${clCards.length}장</span>
        </div>
        <div class="card-grid">${clCards.map(card => renderCard(card, cards.indexOf(card))).join('')}</div>
      </div>`;
    });
    area.innerHTML = html;
  } else {
    area.innerHTML = `<div class="card-grid">${filtered.map(card => renderCard(card, cards.indexOf(card))).join('')}</div>`;
  }
}

function renderCard(card, ci) {
  const evalBlocks = evaluators.map((ev, ei) => {
    const ev_ = card.evals[ei] || {grade: GRADES[0], comment: ''};
    const cur = ev_.grade || GRADES[0];
    const btnId = `gb-${card.id}-${ei}`;

    return `<div class="ev-block">
      <div class="ev-row">
        <div class="ev-name ev-name-${ei}">${ev}</div>
        <div class="ev-grade">
          <button class="grade-btn grade-${cur}" id="${btnId}"
            onclick="toggleGrade('${btnId}',${ci},${ei})">
            ${cur} <span style="font-size:10px;opacity:.8;">▾</span>
          </button>
        </div>
      </div>
      <div class="ev-comment">
        <textarea class="cmt-inp" rows="3" placeholder="코멘트…"
          data-ci="${ci}" data-ei="${ei}">${ev_.comment}</textarea>
      </div>
    </div>`;
  }).join('');

  return `<div class="card-item">
    <div class="card-img-wrap">
      <img src="${card.imageUrl}" alt="${card.name}"
        data-id="${card.id}" data-fb="0"
        onerror="onImgErr(this,'${card.id}','${card.cropImage||''}')" loading="lazy"/>
    </div>
    <div class="card-title-bar">
      <span class="card-title" title="${card.name}">${card.name}</span>
    </div>
    <div class="card-evals">${evalBlocks}</div>
  </div>`;
}

// ── 저장 공통 ─────────────────────────────────────────────────
function getAllOrdered() {
  const out = [];
  CLASS_ORDER.forEach(cl => cards.filter(c => normClass(c.cardClass) === cl.key).forEach(c => out.push(c)));
  return out;
}

// ── 엑셀 ──────────────────────────────────────────────────────
function exportExcel() {
  if (!cards.length) { alert('카드가 없습니다.'); return; }
  const info = TARGET_EXPANSIONS.find(e => e.id === selectedExpId);
  const wb = XLSX.utils.book_new();
  const makeRows = list => list.map(card => {
    const row = {'카드 이름': card.name, '직업': getClsInfo(card.cardClass).label};
    evaluators.forEach((ev, ei) => {
      row[`${ev} 등급`] = card.evals[ei]?.grade || '';
      row[`${ev} 코멘트`] = card.evals[ei]?.comment || '';
    });
    return row;
  });
  const ordered = getAllOrdered();
  const name = info ? info.ko.slice(0, 28) : '전체';
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(makeRows(ordered)), '전체');
  CLASS_ORDER.forEach(cl => {
    const lst = ordered.filter(c => normClass(c.cardClass) === cl.key);
    if (lst.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(makeRows(lst)), cl.label);
  });
  XLSX.writeFile(wb, `HS_평가_${name}.xlsx`);
}

// ── PDF ───────────────────────────────────────────────────────
function exportPDF() {
  if (!cards.length) { alert('카드가 없습니다.'); return; }
  const info = TARGET_EXPANSIONS.find(e => e.id === selectedExpId);
  const gBg = {'판도':'#C47B2A','좋음':'#2A7A3A','가능성':'#2A5AA0','가루':'#505050'};
  const gTx = {'판도':'#fff',   '좋음':'#fff',    '가능성':'#fff',   '가루':'#fff'   };
  const ordered = getAllOrdered();
  let secs = '';
  CLASS_ORDER.forEach(cl => {
    const lst = ordered.filter(c => normClass(c.cardClass) === cl.key);
    if (!lst.length) return;
    const html = lst.map(card => {
      const evHtml = evaluators.map((ev, ei) => {
        const g = card.evals[ei]?.grade || '';
        const cmt = card.evals[ei]?.comment || '';
        return `<div style="border-bottom:1px solid #2a2010;padding:4px 6px;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
            <span style="font-size:10px;font-weight:700;color:#C8A060;min-width:36px;">${ev}</span>
            <span style="background:${gBg[g]||'#333'};color:${gTx[g]||'#ccc'};padding:1px 8px;border-radius:8px;font-size:9px;">${g}</span>
          </div>
          ${cmt ? `<div style="font-size:10px;color:#C8B898;padding-left:4px;">${cmt}</div>` : ''}
        </div>`;
      }).join('');
      return `<div style="break-inside:avoid;margin-bottom:8px;background:#1e1609;border:1px solid #444;border-radius:8px;overflow:hidden;display:flex;">
        <img src="${card.imageUrl}" style="width:80px;flex-shrink:0;display:block;object-fit:cover;"/>
        <div style="flex:1;min-width:0;border-left:1px solid #333;">
          <div style="padding:4px 6px;font-size:11px;font-weight:700;color:#F0E6D0;border-bottom:1px solid #333;">${card.name}</div>
          ${evHtml}
        </div>
      </div>`;
    }).join('');
    secs += `<div style="margin-bottom:20px;"><h2 style="font-size:13px;font-weight:700;color:#C47B2A;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #444;">${cl.label} (${lst.length}장)</h2>${html}</div>`;
  });
  const title = info ? info.ko : '카드 평가표';
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>
  <style>body{background:#1A1208;color:#F0E6D0;font-family:sans-serif;padding:18px;margin:0;}h1{font-size:15px;color:#C47B2A;margin-bottom:14px;}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}</style>
  </head><body><h1>🃏 ${title}</h1>${secs}<script>window.onload=()=>window.print();<\/script></body></html>`);
  w.document.close();
}

// ── 시작 ──────────────────────────────────────────────────────
init();
</script>
